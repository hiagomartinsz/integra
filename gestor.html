<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Gestor — Integra+</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topo"></header>
  <div class="app">
    <nav id="menuLateral"></nav>
    <main class="conteudo">
      <div class="conteudo-interno" id="pagina"></div>
    </main>
  </div>
  <nav id="navInferior"></nav>

  <!-- Novo colaborador -->
  <dialog class="modal" id="modalNovoColaborador" aria-labelledby="tituloNovoColaborador">
    <div class="modal-topo">
      <div>
        <h2 id="tituloNovoColaborador">Novo colaborador</h2>
        <p class="subtitulo">A jornada começa automaticamente na data de início.</p>
      </div>
      <button class="btn-fechar" data-fechar-modal aria-label="Fechar"><span data-icone="fechar"></span></button>
    </div>
    <form class="modal-corpo" id="formNovoColaborador">
      <div class="campo">
        <label for="nomeNovo">Nome completo</label>
        <input id="nomeNovo" name="nome" required autocomplete="off">
      </div>
      <div class="campo">
        <label for="cargoNovo">Cargo</label>
        <input id="cargoNovo" name="cargo" required autocomplete="off">
      </div>
      <div class="campo">
        <label for="inicioNovo">Data de início</label>
        <input id="inicioNovo" name="inicio" type="date" required>
      </div>
      <button class="btn btn-primario btn-bloco" type="submit">Cadastrar e definir funções</button>
    </form>
  </dialog>

  <script src="js/icones.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/ia.js"></script>
  <script src="js/cursos-externos.js"></script>
  <script src="js/gestor-acoes.js"></script>
  <script src="js/gestor.js"></script>
</body>
</html>
